<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card {
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .accordion-button:not(.collapsed) {
            background-color: #e7f1ff;
        }
        .server-error {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">📡 Monitor de Servidores</h1>
        
        <!-- Contenedor donde se renderizarán los servidores -->
        <div id="servers-container" class="accordion"></div>
        
        <div class="text-center mt-3 text-muted">
            <small>Actualizando cada 30 segundos</small>
        </div>
    </div>

    <script>
        async function fetchAllStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                render(data);
            } catch (error) {
                document.getElementById('servers-container').innerHTML = 
                    `<div class="alert alert-danger">Error al conectar con el servidor: ${error.message}</div>`;
            }
        }

        function render(data) {
            const container = document.getElementById('servers-container');
            let html = '';

            // Servidor local (siempre presente)
            if (data.local) {
                html += renderServer('🏠 ' + data.local.name, data.local, true);
            }

            // Servidores remotos
            if (data.remote && data.remote.length > 0) {
                data.remote.forEach(s => {
                    if (s.message) {
                        // Caso de servidor no implementado o error
                        html += `
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${s.name.replace(/\s/g,'')}">
                                        🌐 ${s.name} (${s.host})
                                    </button>
                                </h2>
                                <div id="collapse-${s.name.replace(/\s/g,'')}" class="accordion-collapse collapse">
                                    <div class="accordion-body server-error">
                                        ⚠️ ${s.message}
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Servidor con métricas (reales o simuladas)
                        html += renderServer('🌐 ' + s.name + ' (' + s.host + ')', s);
                    }
                });
            } else {
                html += '<div class="alert alert-info">No hay servidores remotos configurados.</div>';
            }

            container.innerHTML = html;
        }

        function renderServer(title, metrics) {
            // Si las métricas tienen la estructura esperada
            const cpu = metrics.cpu || 'N/A';
            const memUsed = metrics.memory?.used || 'N/A';
            const memTotal = metrics.memory?.total || 'N/A';
            const disks = metrics.disk || [];
            const uptime = metrics.uptime ? Math.floor(metrics.uptime / 3600) : 'N/A';

            const diskHtml = disks.map(d => 
                `<p class="mb-1"><strong>${d.mount}:</strong> ${d.used} / ${d.size} GB</p>`
            ).join('');

            return `
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${title.replace(/\s/g,'')}">
                            ${title}
                        </button>
                    </h2>
                    <div id="collapse-${title.replace(/\s/g,'')}" class="accordion-collapse collapse show">
                        <div class="accordion-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title">CPU</h5>
                                            <p class="card-text display-6">${cpu}%</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title">RAM</h5>
                                            <p class="card-text display-6">${memUsed} / ${memTotal} GB</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title">Disco</h5>
                                            <div class="card-text">${diskHtml || '<p>N/A</p>'}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5 class="card-title">Uptime</h5>
                                            <p class="card-text display-6">${uptime} h</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Cargar al inicio y cada 30 segundos
        fetchAllStatus();
        setInterval(fetchAllStatus, 30000);
    </script>

    <!-- Bootstrap JS para el acordeón -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
